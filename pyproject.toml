[project]
name = "bond-terms"
version = "0.0.0"
description = "Extraction des conditions des obligations à partir des documents publiés par l'ESMA, vérifiée sur la base FIRDS."
readme = "README.md"
authors = [{ name = "Nathan Mang" }]
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=44",
    "defusedxml>=0.7.1",
    "pyarrow>=21",
    "pypdf>=6",
]

[dependency-groups]
dev = [
    "ruff>=0.13",
    "mypy>=1.18",
    "pytest>=8.4",
    "pre-commit>=4.3",
    "types-defusedxml>=0.7.0.20260504",
]
entrepot = [
    "dbt-core>=1.10",
    "dbt-duckdb>=1.10",
]
# Lecture des scans par OCR locale, en mesure pour l'ADR 0002.
ocr = [
    "onnxruntime>=1.20",
    "pypdfium2>=5",
    "rapidocr>=3.10",
]
# Bac à sable BigQuery : installé à la demande (--group bigquery), jamais en CI.
bigquery = [
    "dbt-bigquery>=1.12",
]

[tool.uv]
# L'entrepôt est installé sur le poste et en CI, pour que mypy et les tests le vérifient aussi.
default-groups = ["dev", "entrepot"]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "W",  # style PEP 8
    "F",       # erreurs logiques (variables inutilisées, imports manquants)
    "I",       # ordre des imports
    "UP",      # syntaxe Python moderne
    "B",       # pièges courants (arguments mutables par défaut, etc.)
    "SIM",     # simplifications
    "N",       # conventions de nommage
    "S",       # sécurité (bandit) : SQL concaténé, secrets en dur, subprocess...
]

[tool.ruff.lint.per-file-ignores]
# Scripts : URL et programmes fixes choisis par nous, tirages d'échantillons sans enjeu de sécurité.
"scripts/**" = ["S310", "S311", "S603"]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "scripts"]

# pyarrow ne publie pas d'annotations de types : ses imports sont acceptés sans vérification.
[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*"]
ignore_missing_imports = true

# Les outils d'OCR ne sont pas installés en CI : leurs imports n'y sont pas vérifiés.
[[tool.mypy.overrides]]
module = ["rapidocr", "rapidocr.*", "pypdfium2", "pypdfium2.*"]
ignore_missing_imports = true

# Le client BigQuery n'est pas installé en CI : ses imports n'y sont pas vérifiés.
[[tool.mypy.overrides]]
module = ["google", "google.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
