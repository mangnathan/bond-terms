[project]
name = "bond-terms"
version = "0.0.0"
description = "Extraction des conditions des obligations à partir des documents publiés par l'ESMA, vérifiée sur la base FIRDS."
readme = "README.md"
authors = [{ name = "Nathan Mang" }]
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "defusedxml>=0.7.1",
]

[dependency-groups]
dev = [
    "ruff>=0.13",
    "mypy>=1.18",
    "pytest>=8.4",
    "pre-commit>=4.3",
    "types-defusedxml>=0.7.0.20260504",
]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "W",  # style PEP 8
    "F",       # erreurs logiques (variables inutilisées, imports manquants)
    "I",       # ordre des imports
    "UP",      # syntaxe Python moderne
    "B",       # pièges courants (arguments mutables par défaut, etc.)
    "SIM",     # simplifications
    "N",       # conventions de nommage
    "S",       # sécurité (bandit) : SQL concaténé, secrets en dur, subprocess...
]

[tool.ruff.lint.per-file-ignores]
# Scripts : URL fixes choisies par nous, et tirages d'échantillons sans enjeu de sécurité.
"scripts/**" = ["S310", "S311"]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
